yaml
name: Court Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kallang-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          KALLANG_BEARER_TOKEN: ${{ secrets.KALLANG_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/monitor.py

      - name: Commit updated snapshot
        run: |
          git config user.name "kallang-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Update court availability snapshot"
          git push
