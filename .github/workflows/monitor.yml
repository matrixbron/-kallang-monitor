name: Kallang Tennis Court Monitor

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes (GitHub may delay this under load)
  workflow_dispatch: {}       # lets you trigger a manual run from the Actions tab

permissions:
  contents: write            # needed so the workflow can commit the updated snapshot

concurrency:
  group: kallang-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r kallang-monitor/requirements.txt

      - name: Run monitor
        env:
          KALLANG_BEARER_TOKEN: ${{ secrets.KALLANG_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kallang-monitor/scripts/monitor.py

      - name: Commit updated snapshot
        run: |
          git config user.name "kallang-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add kallang-monitor/state/
          git diff --cached --quiet || git commit -m "Update court availability snapshot"
          git push
